<style>
    .container{
        display: grid;
        grid-template-columns: 1fr 3fr;
        grid-template-rows:50px 200px 100px 50px;

    }
    .header{
        background-color:aquamarine;
        grid-columns-start:1;
        grid-column-end:3;
    }
    .siderbar{
        background-color:black;
        grid-column-start: 1;
        grid-column-end: 2;
        grid-row-start: 2;
        grid-row-end: 4;

    }
    .content{
        background-color:blueviolet;
        grid-column: 2/3;
        grid-row: 2/4
    }
</style>
